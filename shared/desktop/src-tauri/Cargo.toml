[package]
name = "torikomi-desktop"
version = "2.0.0"
description = "Torikomi for Windows and macOS"
edition = "2021"
rust-version = "1.90"

[lib]
name = "torikomi_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
rfd = "0.15"
opener = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
flate2 = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
